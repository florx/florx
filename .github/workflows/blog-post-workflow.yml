name: Latest blog post workflow

# ⚠️ DO NOT MERGE UNTIL THIS REPO IS IN THE `florxlabs` ORGANISATION. The pool's
# runners are organisation-scoped, so until then the label below matches no
# runner and the job queues indefinitely rather than failing.
on:
  #schedule:
  # Runs every hour
  #  - cron: '43 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    # Bare: this is two JavaScript actions and nothing else.
    runs-on: [self-hosted, linux, x64]
    # Dispatch-only and normally seconds. A hang here would sit on a quarter of
    # a four-runner box until someone noticed, which for a workflow nobody runs
    # could be a long time.
    timeout-minutes: 10
    steps:
      # Was v2, which targets a Node runtime the runner no longer ships — every
      # run was already being forced onto a newer one with a deprecation warning.
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: 'https://blog.florxlabs.com/feed'
